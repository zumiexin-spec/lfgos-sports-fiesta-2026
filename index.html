  <!-- Immediate Single URL Enforcement: Strip any hash slug from address bar before render -->
  <script>
    if (window.location.hash) {
      try {
        window._initialHash = window.location.hash;
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname || '/');
        }
      } catch(e) {}
    }
  </script>

  <!-- Immediate Theme Script to Prevent Theme Flash -->
  <script>
    (function() {
      try {
        if (sessionStorage.getItem('fiesta_splash_done')) {
          document.documentElement.classList.add('no-splash');
        }
        const saved = localStorage.getItem('fiesta_theme') || 'auto';
        const isSysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = saved === 'dark' || (saved === 'auto' && isSysDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();
  </script>

  <style>
    /* Critical Splash & Base Styles */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--tx);
      font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    @keyframes sweep {
      0% { transform: translateX(-140%) skewX(-20deg); }
      60%, 100% { transform: translateX(240%) skewX(-20deg); }
    }
    @keyframes grow {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .logo { animation: grow 0.9s ease-out both; }
    .sw {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      background: linear-gradient(90deg, transparent, rgba(255,195,66,0.55), transparent);
      animation: sweep 1.6s ease-in-out 0.5s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .sw, .pdot { animation: none !important; }
    }
    /* Touch target minimum 48px */
    a, button, select, input {
      min-height: 48px;
    }
  </style>
